[project]
name = "tensordata"
version = "0.0.9"
description = "A common repository for tensor structured datasets."
authors = [
    { name = "Cyrillus Tan", email = "cyztan@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.14, <3.15"
dependencies = [
    "pandas>=3.0,<4.0",
    "xarray>=2026.7,<2027.0.0",
    "numpy>=2.5,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.16,<0.17",
    "ty>=0.0.64,<0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Unused arguments
    "ARG",
]
